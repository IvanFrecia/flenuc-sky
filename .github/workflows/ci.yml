name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portfolio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/portfolio/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Brand guard (no org marketing brand in app copy)
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -x scripts/assert_no_org_brand.py ]]; then
            python3 scripts/assert_no_org_brand.py
          else
            echo "Brand guard script not executable; running with python"
            python3 scripts/assert_no_org_brand.py || true
          fi

      - name: Import + health smoke (ASGI)
        env:
          ENV: test
          PORT: "8080"
          PUBLIC_BASE_URL: http://test
          LEDGER_PATH: /tmp/flenuc-sky-ci-ledger.json
          PYTHONPATH: ${{ github.workspace }}/apps/portfolio
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          r = client.get("/api/health")
          assert r.status_code == 200, r.text
          body = r.json()
          assert body.get("status") == "ok", body
          home = client.get("/")
          assert home.status_code == 200, home.text
          print("smoke ok", body)
          PY

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flenuc-sky:ci .
      - name: Run container health
        run: |
          docker run -d --name flenuc-ci -p 18080:8080 -e PORT=8080 -e ENV=production flenuc-sky:ci
          for i in $(seq 1 30); do
            if curl -sfS http://127.0.0.1:18080/api/health; then
              echo
              docker rm -f flenuc-ci
              exit 0
            fi
            sleep 1
          done
          docker logs flenuc-ci || true
          docker rm -f flenuc-ci
          exit 1
